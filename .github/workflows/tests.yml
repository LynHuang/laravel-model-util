name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:    [ '7.4', '8.1', '8.2', '8.3' ]
        laravel: [ '^8.0', '^9.0', '^10.0', '^11.0' ]
        exclude:
          # PHP 7.4 + Laravel 9/10/11: Laravel 9+ 要 PHP 8+
          - php: '7.4'
            laravel: '^9.0'
          - php: '7.4'
            laravel: '^10.0'
          - php: '7.4'
            laravel: '^11.0'
          # PHP 8.1 + Laravel 11: Laravel 11 要 PHP 8.2+
          - php: '8.1'
            laravel: '^11.0'
        include:
          # PHP 7.4 上 composer 必须锁 2.5.x（composer 2.6+ 全面要求 PHP 8+）；
          # 8.x 上用最新 2.x 即可（含 security advisory 拦截等较新特性）。
          - php: '7.4'
            composer: '2.5'
          - php: '8.1'
            composer: '2'
          - php: '8.2'
            composer: '2'
          - php: '8.3'
            composer: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          composer-version: ${{ matrix.composer }}

      - name: Install dependencies for Laravel ${{ matrix.laravel }}
        # 1) Composer 2.7+ 默认开启 security advisory 拦截，而 laravel/framework
        #    在 ^9.0 / ^10.0 / ^11.0 范围内的所有版本都被标记了历史公告
        #    （PKSA-m5cs-t1y6-qpcs 等），会导致整个 install 阶段无法进行。
        #    CI 是跑矩阵测试，不等同于生产安装，所以临时关掉拦截；
        #    不写入 composer.json，避免下游用户被屏蔽掉重要的安全信息。
        # 2) 用 --update-with-all-dependencies 一次完成"改版本 + 解析 lock + 装包"，
        #    避免旧写法（composer require --no-update + composer install）因
        #    lock 与 json 不一致而报 'lock file is not up to date'。
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --update-with-all-dependencies

      - name: Run tests
        run: composer test
