name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
        laravel: [ '^9.0', '^10.0', '^11.0' ]
        exclude:
          - php: '8.1'
            laravel: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies for Laravel ${{ matrix.laravel }}
        # 仓库自带 composer.lock（如 laravel/framework 8.x 锁住），旧写法 composer require --no-update
        # 再 composer install 会因为 lock 里的 8.x 不满足 ^9.0/^10.0/^11.0 而直接报错。
        # 合并成单条 --update-with-all-dependencies，让 composer 重新解析 lock 后再装包。
        run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --update-with-all-dependencies

      - name: Run tests
        run: composer test
